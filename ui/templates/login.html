{{define "content"}}
<div class="login panel">
  <h1>Sign in</h1>
  <p class="lede" data-i18n>Sign in with the master credential or an administrator API key to manage this gateway.</p>
  <form method="POST" action="{{.Base}}/login">
    <input type="hidden" name="next" value="{{.Next}}">
    <label class="field">credential
      <input type="password" name="key" autocomplete="current-password" autofocus required>
    </label>
    <button type="submit">sign in</button>
  </form>
</div>
{{end}}
