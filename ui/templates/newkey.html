{{define "content"}}
<h1>New key</h1>
<p class="lede" data-i18n>Create an API key. The secret is shown once after creation. Optional fields can be left empty.</p>

<form class="panel stack" method="POST" action="{{.Base}}{{.ActionPath}}" autocomplete="off">
  <input type="hidden" name="csrf" value="{{.CSRF}}">
  <input type="hidden" name="action" value="create">

  <div class="grid">
    <label class="field">alias
      <input type="text" name="key_alias" placeholder="team-search">
      <small>Display name. It is not the credential and not derived from it.</small>
    </label>
    <label class="field">user id
      <input type="text" name="user_id" placeholder="u_42">
      <small>The owning user. Its role, block flag and ceilings apply on top of this key's.</small>
    </label>
    <label class="field">team id
      {{if .TeamFixed}}
        <input type="text" name="team_id" value="{{.Team}}" readonly>
        <small>This credential administers one team, and a key minted onto another would be refused.</small>
      {{else}}
        <input type="text" name="team_id" placeholder="t_7">
        <small>The owning team. A key on no team is a deployment-wide one.</small>
      {{end}}
    </label>
    <label class="field">expires in
      <input type="text" name="duration" placeholder="30d">
      <small>&ldquo;30d&rdquo;, &ldquo;12h&rdquo;, &ldquo;90m&rdquo;. Empty never expires.</small>
    </label>
  </div>

  <div class="grid">
    <label class="field">models
      <input type="text" name="models" placeholder="model-large, model-small">
      <small>Comma separated allow-list, compared whole. Empty allows all.</small>
    </label>
    <label class="field">routes
      <input type="text" name="allowed_routes" placeholder="/v1/chat/completions, /v1/models">
      <small>Comma separated route allow-list. Empty allows all.</small>
    </label>
    <label class="field">tags
      <input type="text" name="tags" placeholder="prod, search">
      <small>Comma separated. They key the tag reports.</small>
    </label>
  </div>

  <div class="grid">
    <label class="field">budget
      <input type="text" name="max_budget" inputmode="decimal" placeholder="250">
      <small>Spend ceiling, an exact decimal. Empty is no ceiling.</small>
    </label>
    <label class="field">budget period
      <input type="text" name="budget_duration" placeholder="monthly">
      <small>The window the ceiling and the spend beside it are both measured over.</small>
    </label>
    <label class="field">rpm limit
      <input type="text" name="rpm_limit" inputmode="numeric" placeholder="600">
      <small>Stored; see OPERATIONS §12 for what this build enforces.</small>
    </label>
    <label class="field">tpm limit
      <input type="text" name="tpm_limit" inputmode="numeric" placeholder="120000">
      <small>Stored; see OPERATIONS §12 for what this build enforces.</small>
    </label>
  </div>

  <div class="grid">
    <label class="field">tier
      <input type="text" name="tier" placeholder="paid">
      <small>Assigned by an operator and never claimed by a caller (§10.5).</small>
    </label>
    <label class="field">priority class
      <input type="text" name="priority_class" placeholder="interactive">
      <small>Defaults to <code>default</code>.</small>
    </label>
  </div>

  <div class="row">
    <button type="submit" class="primary">create the key</button>
    <a class="button" href="{{.Base}}/keys">cancel</a>
  </div>
</form>
{{end}}
