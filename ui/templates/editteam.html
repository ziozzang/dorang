{{define "content"}}
<h1>Edit team</h1>
<p class="lede" data-i18n>Edit team identity, access and limits. Empty optional fields clear their value.</p>

<form class="panel stack" method="POST" action="{{.Base}}{{.ActionPath}}" autocomplete="off">
  <input type="hidden" name="csrf" value="{{.CSRF}}">
  <input type="hidden" name="action" value="update_team">
  <input type="hidden" name="team_id" value="{{.ID}}">
  <input type="hidden" name="return" value="{{.Base}}/users">

  <div class="grid">
    <label class="field">id
      <input type="text" value="{{.ID}}" readonly>
      <small class="mono">{{if .Blocked}}blocked{{else}}active{{end}}</small>
    </label>
    <label class="field">name
      <input type="text" name="team_name" value="{{.Name}}" placeholder="Search">
    </label>
    <label class="field">alias
      <input type="text" name="team_alias" value="{{.Alias}}" placeholder="search-team">
      <small>Empty clears it.</small>
    </label>
    <label class="field">organization id
      <input type="text" name="organization_id" value="{{.Org}}" placeholder="org_1">
      <small>Empty clears it.</small>
    </label>
  </div>

  <div class="grid">
    <label class="field">budget
      <input type="text" name="max_budget" value="{{.Budget}}" inputmode="decimal" placeholder="1000">
      <small>Spend ceiling, an exact decimal. Empty is no ceiling.</small>
    </label>
    <label class="field">budget period
      <input type="text" name="budget_duration" value="{{.BudgetPeriod}}" placeholder="monthly">
    </label>
    <label class="field">rpm limit
      <input type="text" name="rpm_limit" value="{{.RPM}}" inputmode="numeric" placeholder="6000">
      <small>Empty is no limit.</small>
    </label>
    <label class="field">tpm limit
      <input type="text" name="tpm_limit" value="{{.TPM}}" inputmode="numeric" placeholder="1000000">
      <small>Empty is no limit.</small>
    </label>
  </div>

  <div class="grid">
    <label class="field">max parallel
      <input type="text" name="max_parallel_requests" value="{{.MaxParallel}}" inputmode="numeric" placeholder="20">
      <small>Concurrent requests. Empty is no limit.</small>
    </label>
    <label class="field">models
      <input type="text" name="models" value="{{.Models}}" placeholder="model-large, model-small">
      <small>Comma separated allow-list. Empty allows all.</small>
    </label>
  </div>

  <div class="row">
    <button type="submit" class="primary">save changes</button>
    <a class="button" href="{{.Base}}/users">cancel</a>
  </div>
</form>
{{end}}
