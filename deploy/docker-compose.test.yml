# Test/dev dependencies for dorang. Not a production deployment.
#   docker compose -f deploy/docker-compose.test.yml up -d
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: dorang
      POSTGRES_USER: dorang
      POSTGRES_PASSWORD: dorang
    ports: ["55432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d dorang -U dorang"]
      interval: 1s
      timeout: 5s
      retries: 30
    tmpfs: ["/var/lib/postgresql/data"]   # tests want a clean, fast, disposable DB

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["56379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 5s
      retries: 30
