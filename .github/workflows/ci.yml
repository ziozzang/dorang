name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: dorang
          POSTGRES_USER: dorang
          POSTGRES_PASSWORD: dorang
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U dorang -d dorang"
          --health-interval 1s --health-timeout 5s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["56379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 1s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: integration
        env:
          DORANG_TEST_PG: postgres://dorang:dorang@127.0.0.1:55432/dorang?sslmode=disable
          DORANG_TEST_REDIS: redis://127.0.0.1:56379
        run: go test -tags=integration -count=1 ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      - run: go install honnef.co/go/tools/cmd/staticcheck@latest
      - run: staticcheck ./...
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A citation pointing at someone's home directory leaks a username and a
      # directory layout, and is useless to any reader. This has happened once;
      # the guard is cheaper than noticing again.
      - name: no local filesystem paths
        run: |
          if git grep -nE '/(home|Users)/[A-Za-z0-9_.-]+/' -- . ':!*.md'; then
            echo "::error::absolute home paths found in tracked files"; exit 1
          fi
          if git grep -nE '/(home|Users)/[A-Za-z0-9_.-]+/' -- '*.md'; then
            echo "::error::absolute home paths found in docs"; exit 1
          fi

      # Several defaults are written as `~/...` and resolve against the
      # operator's home when DORANG_STATE_DIR is unset. A package whose tests
      # forget to override them appends to the real state directory instead of a
      # temporary one — which is rude, and worse, makes the spool shared state
      # that carries between runs. internal/app did this until 36 MB had piled
      # up in a live installation and started slowing the meter the tests were
      # measuring. Nothing failed; a directory just grew.
      - name: tests write no state to the home directory
        run: |
          mkdir -p "$HOME/.dorang"
          before=$(find "$HOME/.dorang" -type f | wc -l)
          go test -count=1 ./... >/dev/null
          after=$(find "$HOME/.dorang" -type f | wc -l)
          if [ "$after" -ne "$before" ]; then
            echo "::error::the test suite wrote into \$HOME/.dorang ($before -> $after files)."
            echo "Set DORANG_STATE_DIR to a temp dir in that package's TestMain; see internal/app/main_test.go."
            find "$HOME/.dorang" -type f | head -20
            exit 1
          fi
