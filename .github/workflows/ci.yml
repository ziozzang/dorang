name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: dorang
          POSTGRES_USER: dorang
          POSTGRES_PASSWORD: dorang
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U dorang -d dorang"
          --health-interval 1s --health-timeout 5s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["56379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 1s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: integration
        env:
          DORANG_TEST_PG: postgres://dorang:dorang@127.0.0.1:55432/dorang?sslmode=disable
          DORANG_TEST_REDIS: redis://127.0.0.1:56379
        run: go test -tags=integration -count=1 ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod, cache: true }
      - run: go install honnef.co/go/tools/cmd/staticcheck@latest
      - run: staticcheck ./...
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
