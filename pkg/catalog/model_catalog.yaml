  # The numbers on every row below are still openclaw's, cited by line. A
  # `verified:` here dates the model's EXISTENCE on this route (the banner at
  # the top of this file), not its window: the probe asks whether the endpoint
  # answers to the name, and no request reveals a context window.
  # -------------------------------------------------------------------------
