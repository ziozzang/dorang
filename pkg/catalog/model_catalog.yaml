# dorang — model catalog (DESIGN §10.2)
#
# One entry per (kind, model). Model names are opaque: a `:` in a name is a
# literal character, and nothing in dorang splits on it (DESIGN §2.1,
# REVIEW C3). Names appear here exactly as the provider returns them.
#
# `verified: YYYY-MM-DD` on an entry records when the model's EXISTENCE was
# confirmed against the provider: a request naming it was answered, by it. It
# says nothing about reasoning capability, which carries its own date, and
# nothing about the numbers on the same line, which carry their own citations.
#
# What the ABSENCE of that date means
# -----------------------------------
# It used to mean four unrelated things at once, and an operator could not tell
# them apart. A `probe:` block now records the answers that are definite
# without establishing the model, so the states are:
#
#   verified: DATE          asked; it answered as itself
#   probe: denied           asked; this account's plan is not entitled. The
#                           model EXISTS — the refusal text says eligibility,
#                           not absence — so deleting the entry would throw
#                           away a context window another plan can reach
#   probe: substituted      asked; a DIFFERENT model answered, named in
#                           `served`. A 200 with a body, and every number here
#                           describes a model the caller is not talking to
#   kind: probe:            nobody could ask: no credential for that route
#     citation_only         exists where this catalog is maintained, so every
#                           entry under it is transcription and always has been
#   (nothing)               nobody has asked, and nothing says why. A backlog
#                           item, and now a small one
#
# `dorangctl catalog unverified` reports these separately, and `dorangctl
# catalog verify --kind K` is what produces them. A retirement is still a
# DELETION rather than a state: a retired model serves nobody, so the entry is
# knowledge that expired, while a denied model is knowledge that is correct and
# merely out of reach from here.
#
# Reasoning
# ---------
# An absent `reasoning:` block means `unknown`, and unknown is the default for
# every model here. Unknown is not a gap to be filled with a plausible guess:
# dorang omits the reasoning control and reports it in x-dorang-dropped-params
# rather than send a form the model may silently ignore or reject (§10.2).
#
# A block may claim a concrete capability only together with `verified:`, the
# date the form was accepted by the live endpoint. Loading refuses any entry
# that claims a capability without one, and refuses `unknown` carrying a date.
# Catalog.UnverifiedModels lists everything still unprobed.
#
# The model lists in the FIRST HALF of this file were fetched from the live
# endpoints on 2026-07-28 and asked again on 2026-08-03. Reasoning capability
# was NOT probed in either pass, so exactly one entry claims a concrete
# capability: qwen3.8-max-preview, whose effort scale is in use in an operator
# configuration today.
#
# The SECOND HALF was absorbed from third-party catalogs (openclaw,
# hermes-agent). It was uniformly undated until 2026-08-03, when the one
# provider block behind a credential here — qwen — was asked model by model.
# Thirteen of the ~200 absorbed entries now carry a live answer; the rest are
# still transcription, and their kinds say so with `probe: citation_only`
# rather than leaving them looking merely unread. Read the banner above the
# second half before using any number from it. `verified:` means dorang's
# operator checked; reading somebody else's repository is not checking.
#
# `context_window` and `max_output_tokens` are in tokens; 0 or absent means
# undeclared, and callers must treat that like unknown rather than as a bound.
#
# Pricing
# -------
# `pricing:` is a hint for cost-aware routing before any pricing rule matches.
# Authoritative cost lives in the pricing rule set (DESIGN §8), which can
# express subscriptions and adjustments a per-token pair cannot. No prices were
# verified in the 2026-07-28 pass, so no entry carries one; a fabricated price
# would flow straight into routing decisions and invoices. Shape, for operators
# adding their own:
#
#   pricing:
#     currency: USD
#     input_per_mtok: "0.60"          # exact decimal, kept as written
#     output_per_mtok: "2.20"
#     cached_input_per_mtok: "0.06"
#     verified: 2026-07-28

