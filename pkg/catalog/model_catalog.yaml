  # =========================================================================
  # Z.AI coding plan — https://api.z.ai/api/coding/paas/v4  (kind: glm)
  # Model list fetched from the live endpoint on 2026-07-28: 8 models.
  # ASKED 2026-08-03, one minimal request each. Five answered as themselves.
  # THREE ANSWERED AS SOMETHING ELSE.
  #
  # This is the finding that a listing cannot produce and that a status code
  # cannot either: `glm-5.1` returns 200, with a body, whose `model` field says
  # `glm-5.2`. So does `glm-5`. `glm-4.5-air` answers as `glm-4.7`. Stable
  # across three runs on 2026-08-03, and the field is not a constant — the
  # other five echo their own names back, so it tracks what served.
  #
  # A 200 is the outcome that looks most like success, which is exactly why it
  # needed a state. Routing to `glm-5.1` here does not get glm-5.1: it gets
  # glm-5.2's behaviour, and every number this catalog holds for `glm-5.1`
  # then describes a model the caller is not talking to. Nothing in dorang
  # rewrites the request to the served name — recording that the endpoint
  # substitutes is not permission to substitute.
  #
  # Note the collision with Ollama Cloud: `glm-5.1` and `glm-5.2` exist on
  # both providers. They are different entries because the key is (kind,
  # model). Nothing about the name identifies its provider — provider identity
  # comes only from configuration (DESIGN §2.1 rule 2).
  # =========================================================================

  - { kind: glm, model: "glm-4.5",       verified: 2026-08-03 }
  - { kind: glm, model: "glm-4.6",       verified: 2026-08-03 }
  - { kind: glm, model: "glm-4.7",       verified: 2026-08-03 }
  - { kind: glm, model: "glm-5-turbo",   verified: 2026-08-03 }
  - { kind: glm, model: "glm-5.2",       verified: 2026-08-03 }

  - kind: glm
    model: "glm-4.5-air"
    probe:
      result: substituted
      date: 2026-08-03
      served: "glm-4.7"
      note: >-
        200 OK, body `"model":"glm-4.7"`. Dated verified: 2026-07-28 by the
        first pass, which read the /models listing; asking is what found it.
  - kind: glm
    model: "glm-5"
    probe:
      result: substituted
      date: 2026-08-03
      served: "glm-5.2"
      note: '200 OK, body `"model":"glm-5.2"`. Same on three consecutive runs.'
  - kind: glm
    model: "glm-5.1"
    probe:
      result: substituted
      date: 2026-08-03
      served: "glm-5.2"
      note: '200 OK, body `"model":"glm-5.2"`. Same on three consecutive runs.'

