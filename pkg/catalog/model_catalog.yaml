  # =========================================================================
  # ABSORBED 2026-07-28 from openclaw and hermes-agent. Read this before
  # trusting any number below it.
  # =========================================================================
  #
  # Everything from here down was read out of another repository. `verified:`
  # means dorang's operator confirmed the entry against the provider, and
  # reading somebody else's catalog is not that, so every entry below arrived
  # on the probe list by construction.
  #
  # Thirteen of them have since come off it. On 2026-08-03 the qwen block was
  # asked model by model — the only absorbed provider a credential exists for
  # here — and four now carry `verified: 2026-08-03` while nine carry
  # `probe: {result: denied}`. Their numbers are still openclaw's; a date on
  # those rows says the endpoint answers to the name, nothing more.
  #
  # The other ~195 rows were not skipped for lack of effort. There is no
  # credential for their routes where this catalog is maintained, so no request
  # can be sent and no date can honestly be written. Their KINDS say exactly
  # that with `probe: {result: citation_only}` in provider_defaults.yaml, which
  # is what separates "nobody could look" from "nobody has looked yet". An
  # operator who does hold a key closes the gap with
  # `dorangctl catalog verify --kind <kind> --write overlay.yaml`; the overlay
  # supersedes both the kind marker and these rows.
  #
  # Each provider block cites the file it came from; each entry cites the line
  # of its own `"id"` in that file. openclaw's `openclaw.plugin.json`
  # `modelCatalog.providers.<id>` blocks are per-route: the block's `baseUrl`
  # is the endpoint, and each model row states its own contextWindow and
  # maxTokens. That route-scoping is why they are usable at all — a limit
  # belongs to a deployment, not to a set of weights.
  #
  # What was thrown away, and why
  # -----------------------------
  # 1. Any value byte-identical to that extension's own fallback constant.
  #    A fallback records that nobody looked. This removed every github-copilot
  #    row except gpt-5.5 (128000/8192 = DEFAULT_CONTEXT_WINDOW/DEFAULT_MAX_TOKENS,
  #    extensions/github-copilot/models.ts:29-30), eleven venice context
  #    windows (128000 = VENICE_DEFAULT_CONTEXT_WINDOW, extensions/venice/models.ts:31),
  #    one baseten window, and all of openclaw's ollama-cloud rows.
  # 2. Any `maxTokens` equal to that row's own `contextWindow`. It is not an
  #    output ceiling, it is the absence of one, and over-declaring output is
  #    the unsafe direction (DESIGN §4.3). This removed the max output of every
  #    moonshot, deepinfra and baseten row, among others.
  # 3. Any value for a model on a DIFFERENT route than the one it is filed
  #    under. openclaw's `zai` provider describes https://api.z.ai/api/paas/v4;
  #    dorang's `glm` kind is the coding plan at .../api/coding/paas/v4. Same
  #    vendor, same model names, different limits — those numbers are in
  #    model_catalog.overlay.example.yaml under a kind the overlay declares,
  #    not here.
  # 4. Every reasoning capability, without exception. Sources state reasoning
  #    shapes per model in abundance, and they contradict each other and
  #    themselves across routes. `unknown` stands (DESIGN §10.2, REVIEW C5).
  # 5. Every price. openclaw's manifests carry a full `cost` block per model.
  #    None of it is here: a fabricated price flows straight into routing
  #    decisions and invoices, and "openclaw said so in July" is not a price.

