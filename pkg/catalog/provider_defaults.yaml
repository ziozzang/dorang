    category: chat
    supports_tools: true
    supports_streaming: true

  # ---- Self-hosted / local -------------------------------------------------

  ollama:
    api: openai-chat
    base_url: http://127.0.0.1:11434/v1
    # jikji examples/config/airgapped-ollama.yaml:41 names this exact
    # OpenAI-compatible path. openclaw's OLLAMA_DEFAULT_BASE_URL
    # (extensions/ollama/src/defaults.ts:2) is the same host without /v1,
    # because openclaw speaks Ollama's native API there.
    cache: ollama_keep_alive
    # openclaw extensions/ollama/src/stream.ts:279 carries keep_alive as a
    # top-level parameter. It is model RESIDENCY, not prompt caching; the
    # scheme name says what dorang sends, not what the backend caches.
    category: chat
    supports_tools: true
    supports_streaming: true

  # The hosted endpoint at https://ollama.com/v1. Distinct from `ollama`: it
  # takes a credential, hosts a fixed model set, and has no keep-alive knob to
  # hold a model resident, so no prompt-cache scheme applies.
  # surfaces: measured 2026-08-06 and again 2026-09-12 — the host serves
  # /v1/chat/completions, /v1/messages and /v1/responses, and takes the same
  # `Authorization: Bearer` on each (x-api-key on /v1/messages answers 401). A
  # caller on /v1/messages or /v1/responses therefore reaches it in its own
  # shape, with nothing translated and nothing reported lost.
  ollama-cloud:
    surfaces: [chat, messages, responses]
    api: openai-chat
    base_url: https://ollama.com/v1
    # hermes plugins/model-providers/ollama-cloud/__init__.py:81-87 names this
    # exact URL. openclaw addresses the same provider at https://ollama.com on
    # Ollama's native wire (extensions/ollama/openclaw.plugin.json:80-81),
    # where the same models carry a `:cloud` tag.
    cache: none
    category: chat
    supports_tools: true
    supports_streaming: true
    verified: 2026-07-28

  vllm:
