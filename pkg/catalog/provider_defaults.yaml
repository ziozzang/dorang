# dorang — provider kind defaults (DESIGN §4.3)
#
# A kind selects, in one word: the wire adapter, capability defaults, the
# prompt-cache scheme, and the reasoning-control shape.
#
# Reading this file
# ----------------
# `reasoning:` here is a SHAPE HINT — the reasoning form the adapter for this
# kind implements. It is NOT a capability claim about any model on this kind.
# Keying reasoning folding on the provider kind is the defect REVIEW C5
# records: within one provider the control changes across model generations, so
# a kind-level value applied to a model would be silently ignored or rejected
# on some members. Per-model capability lives in model_catalog.yaml and is
# returned by Catalog.Reasoning; it defaults to `unknown` and is never guessed.
# The values here use the §10.2 capability vocabulary. §4.3 names some shapes
# differently; the mapping is: reasoning_effort -> effort_scale,
# glm_thinking -> thinking_flag, thinking_budget and enable_thinking unchanged.
#
# `context_window` and `max_output_tokens` are in tokens, and 0 means
# UNDECLARED — not unlimited, not zero. Same principle as `unknown` reasoning:
# a plausible-looking number that was never checked is worse than no number,
# because context-window fallback routing (§7.6) would act on it. Most kinds
# therefore declare no window; the numbers live on models and prefix rules
# where they were actually observed.
#
# `supports_tools` / `supports_streaming` are defaults for the wire adapter,
# freely overridden per model or by deployment configuration.

version: 1

# Alias -> kind. Aliases are matched against the provider's configured `kind`
# field only. They are never inferred from a model name (DESIGN §2.1 rule 2).
kind_aliases:
  dashscope: qwen
  minimax-cn: minimax
  ollama_cloud: ollama-cloud
  ollama-turbo: ollama-cloud
  zai: glm
  z-ai: glm
  "z.ai": zai            # chained: z.ai -> zai -> glm
  x-ai: xai
  codex: codex-responses
  gemini: google
  vertex-ai: vertex
  azure-openai: azure
  microsoft-foundry: azure
  # openclaw's Foundry default API is openai-completions
  # (extensions/microsoft-foundry/shared.ts:22), which is dorang's azure kind.
  grok: xai                # hermes plugins/model-providers/xai/__init__.py:6-13
  "x.ai": xai              # same
  zhipu: glm               # hermes plugins/model-providers/zai/__init__.py:111-125
  google-gemini: google    # hermes plugins/model-providers/gemini/__init__.py:51-59
  google-ai-studio: google # same
  kimi: moonshot           # jikji internal/typebackbone/provider_defaults.yaml:2-7
  llama-cpp: llamacpp
  "llama.cpp": llamacpp
  local: ollama            # hermes plugins/model-providers/custom/__init__.py:84-101

kinds:

  # ---- OpenAI-shaped -------------------------------------------------------

  openai:
    api: openai-chat
    base_url: https://api.openai.com/v1
    # openclaw extensions/openai/openclaw.plugin.json:39, which declares
    # api openai-responses for this base; dorang keeps two kinds for the two
    # surfaces the one host serves.
    cache: openai_cache_key
    reasoning: effort_scale
    category: chat
    supports_tools: true
    supports_streaming: true

  openai-responses:
    api: openai-responses
    base_url: https://api.openai.com/v1   # openclaw extensions/openai/openclaw.plugin.json:39-40
    cache: openai_cache_key
    # §4.3 writes `reasoning_effort` here; on the Responses surface the wire
    # form is the `reasoning: {effort, summary}` object of §10.2.
    reasoning: responses_reasoning
    category: chat
    supports_tools: true
    supports_streaming: true
    probe: { result: citation_only, date: 2026-08-03 }

  # OpenAI models reached through a Codex OAuth credential rather than a
  # platform API key. Same wire surface, different credential and model set.
  #
  # responses_only: the host serves /responses and nothing else. Measured
  # 2026-08-06: POST .../codex/chat/completions answers 403, POST
  # .../codex/responses answers 400 for a body problem. It also requires
  # `stream: true` and `store: false`, each refused separately; those are
  # stated per provider (params.force_stream / params.store_false) and are
  # accepted only on a kind carrying this flag. It also refuses an output
  # ceiling (400 "Unsupported parameter: max_output_tokens", measured
  # 2026-09-12), so a provider on this kind wants params.drop: [max_tokens];
  # the removal is reported to the caller. See docs/SURFACES.md.
  codex-responses:
    api: openai-responses
    cache: openai_cache_key
    reasoning: responses_reasoning
    category: chat
    supports_tools: true
    supports_streaming: true
    responses_only: true
    verified: 2026-07-28

  azure:
    api: openai-chat
    cache: openai_cache_key
    category: chat
    supports_tools: true
    supports_streaming: true
    note: >-
      Deployment-name indirection is configuration, not name parsing: the
      upstream deployment is an explicit field, never derived from the model.

  # ---- Anthropic-shaped ----------------------------------------------------

  anthropic:
    api: anthropic-messages
    base_url: https://api.anthropic.com
    # openclaw extensions/anthropic/openclaw.plugin.json:89-90
    # hermes plugins/model-providers/anthropic/__init__.py:44-52 agrees.
    cache: anthropic_cache_control
    # openclaw extensions/anthropic/register.runtime.ts:974 marks every model
    # on this kind cache-TTL eligible.
    reasoning: thinking_budget
    category: chat
    supports_tools: true
    supports_streaming: true
    probe: { result: citation_only, date: 2026-08-03 }

  minimax:
    api: anthropic-messages
    base_url: https://api.minimax.io/anthropic
    # openclaw extensions/minimax/model-definitions.ts:6
    # hermes plugins/model-providers/minimax/__init__.py:62-93 agrees, and
    # notes that the /anthropic path suffix is what selects this wire; a
    # deployment pointed at https://api.minimax.io/v1 gets the OpenAI wire and
    # must override `api`. The `minimax-cn` alias maps to this kind but the CN
    # route is a different host, https://api.minimaxi.com/anthropic — a
    # deployment there overrides base_url.
    cache: anthropic_cache_control
    category: chat
    supports_tools: true
    supports_streaming: true

  bedrock:
    api: anthropic-messages
    cache: anthropic_cache_control
    category: chat
    supports_tools: true
    supports_streaming: true
    note: >-
      §4.3 elides bedrock's defaults. It fronts several model families, so this
      is a starting point a deployment is expected to override. Both mined
      sources disagree with the wire shape recorded here: openclaw declares
      api "bedrock-converse-stream" (extensions/amazon-bedrock/discovery.ts:695)
      and hermes api_mode "bedrock_converse"
      (plugins/model-providers/bedrock/__init__.py:21-28). dorang has no
      Converse adapter, and naming an API that no adapter implements would be
      a worse lie than this one. No models are listed: openclaw's
      KNOWN_CONTEXT_WINDOWS (discovery.ts:68-139) and hermes'
      BEDROCK_CONTEXT_LENGTHS (agent/bedrock_adapter.py:1351-1391) are both
      hand-maintained tables their own authors label as stale-prone fallbacks
      (bedrock_adapter.py:1509-1514).

  # ---- Google-shaped -------------------------------------------------------

  google:
    api: gemini
    base_url: https://generativelanguage.googleapis.com/v1beta
    # openclaw extensions/google/provider-catalog.ts:12
    # hermes plugins/model-providers/gemini/__init__.py:51-59 agrees.
    cache: google_cached_contents
    # openclaw extensions/google/transport-stream.ts:744-761 sets
    # params.cachedContent and omits system/tools when a handle is present.
    category: chat
    supports_tools: true
    supports_streaming: true

  vertex:
    api: gemini
    cache: google_cached_contents
    category: chat
    supports_tools: true
    supports_streaming: true
    note: >-
      §4.3 elides vertex's defaults; it also fronts non-Gemini families that a
      deployment must configure explicitly.

  # ---- Chat providers on the OpenAI wire -----------------------------------

  glm:
    api: openai-chat
    base_url: https://api.z.ai/api/coding/paas/v4
    # The CODING PLAN, which is the endpoint this kind addresses:
