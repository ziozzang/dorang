  # =========================================================================
  #
  # Everything below carries the `path:line` it came from, relative to
  # . Nothing below was probed against a live endpoint by
  # dorang, so no kind here carries `verified:` — that date means dorang's
  # operator checked, and reading somebody else's repository is not that.
  #
  # `cache:` defaults to `none` for every absorbed kind. That is a finding, not
  # laziness: openclaw has ZERO occurrences of `promptCacheKey` /
  # `prompt_cache_key` anywhere under extensions/, and its per-provider cache
  # hooks (`isCacheTtlEligible`) exist for only a handful of providers. An
  # OpenAI-compatible endpoint is not an OpenAI prompt-cache endpoint, and
  # declaring a scheme the backend ignores costs a wasted cache breakpoint on
  # every request. Where a source does state a scheme, it is set and cited.
  #
  # `context_window` is NOT set on any absorbed kind, even where the sources
  # offer a provider-wide number. A kind-level window is applied to every model
  # on the kind including the ones nobody looked at (DESIGN §4.3), and every
  # provider-wide number on offer turned out to be that provider's own fallback
  # constant. Catalog.Validate warns about kind-level windows for this reason.

