    # openclaw's `zai` provider is a DIFFERENT route,
    # https://api.z.ai/api/paas/v4 (extensions/zai/openclaw.plugin.json:33),
    # with materially different limits — see model_catalog.overlay.example.yaml.
    cache: openai_cache_key
    # §4.3 calls this shape `glm_thinking`; §10.2 classifies it as the boolean
    # {thinking: {type: enabled|disabled}} form.
    reasoning: thinking_flag
    category: chat
    supports_tools: true
    supports_streaming: true
    verified: 2026-07-28

  qwen:
    base_url: https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1
    # openclaw extensions/qwen/openclaw.plugin.json:92
    # jikji internal/foundry/configbuilder/provider_catalog.go:81
    # CONTRADICTION on the wire shape for this exact URL: openclaw declares
    # api openai-completions (:93); jikji declares openai-responses (:79) and
    # so does the operator's own running config (<operator config: jikjicode.yaml>:37).
    # The operator's configuration is first-party for this deployment and is
    # what this kind follows.
    # §4.3 lists `openai-chat`. The token-plan endpoint in use speaks the
    # Responses surface, which is what this default reflects; a deployment on
    # the plain compatible-mode endpoint overrides `api` back to openai-chat.
    api: openai-responses
    cache: openai_cache_key
    # §4.3's shape hint for this kind is enable_thinking. The one qwen model
    # whose capability has actually been verified accepts an effort scale
    # instead — see model_catalog.yaml. That divergence is the point of C5:
    # the hint describes the adapter, the model entry describes the model, and
    # the model entry wins.
    reasoning: enable_thinking
    category: chat
    supports_tools: true
    supports_streaming: true
    verified: 2026-07-28

  deepseek:
    api: openai-chat
    base_url: https://api.deepseek.com
